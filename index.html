<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdiTsar · Editor de video</title>

<style>
:root{--bg:#161618;--p1:#1f1f22;--p2:#26262a;--p3:#303035;--ln:#0c0c0d;--tx:#dcdce0;--mu:#8d8d96;--ac:#7a6bff;--ac2:#4a3fd0;--ok:#4ecb8a;--wa:#ffb347;--er:#ff5d5d;--vid:#3d6fb0;--aud:#3c8f67;--txt:#a8559b;--img:#79963b;--ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:12px/1.35 var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--p3);border:1px solid #0006;border-radius:4px;padding:4px 9px;cursor:pointer}
button:hover{background:#3a3a41}button.on{background:var(--ac2);border-color:var(--ac)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
button.ic{padding:3px 7px;min-width:26px}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{background:#111114;border:1px solid #38383e;border-radius:3px;padding:3px 6px;user-select:text;-webkit-user-select:text}
input[type=number]{width:62px}
input[type=range]{accent-color:var(--ac);height:14px}
#app{display:flex;flex-direction:column;height:100%}
#top{height:38px;flex:none;background:var(--p2);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 10px}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;letter-spacing:.02em}
.brand i{width:20px;height:20px;border-radius:5px;background:var(--ac);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.menu{position:relative}.menu>button{background:transparent;border:0}.menu>button:hover,.menu.open>button{background:var(--p3)}
.dd{position:absolute;top:100%;left:0;min-width:230px;background:var(--p2);border:1px solid #000;border-radius:6px;box-shadow:0 8px 24px #000a;padding:4px;z-index:60;display:none}
.menu.open .dd{display:block}
.dd button{display:flex;justify-content:space-between;gap:20px;width:100%;text-align:left;background:transparent;border:0;border-radius:3px;padding:5px 9px}
.dd button:hover{background:var(--ac2)}.dd hr{border:0;border-top:1px solid #0008;margin:4px 0}.dd kbd{color:var(--mu);font:11px var(--mono)}
.ws{display:flex;gap:2px;margin-left:8px}.ws button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;color:var(--mu)}
.ws button.on{color:var(--tx);border-bottom-color:var(--ac);background:transparent}
.sp{flex:1}
#pname{background:transparent;border:1px solid transparent;font-weight:600;width:200px;text-align:center}#pname:hover,#pname:focus{border-color:#444;background:#111}
.peer{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#000;border:2px solid var(--p2);margin-left:-6px}
#peers{display:flex;padding-left:6px}
#sync{font:11px var(--mono);color:var(--mu)}
#main{flex:1;min-height:0;display:grid;gap:3px;padding:3px;grid-template-columns:310px minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:minmax(0,52fr) minmax(0,48fr);grid-template-areas:"fx src prog" "proj tl tl"}
#main.ws-color{grid-template-columns:420px minmax(0,.8fr) minmax(0,1.4fr)}
#main.ws-audio{grid-template-columns:300px minmax(0,1fr) minmax(0,1fr)}
#pFx{grid-area:fx}#pSrc{grid-area:src}#pProg{grid-area:prog}#pProj{grid-area:proj}#pTl{grid-area:tl}
.panel{background:var(--p1);border:1px solid var(--ln);border-radius:4px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel.focus{border-color:var(--ac)}
.ph{height:26px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--p2);color:var(--mu);font-weight:600;border-bottom:1px solid var(--ln)}
.ph .tabs{display:flex;gap:2px;height:100%}.ph .tabs button{background:transparent;border:0;border-radius:0;border-bottom:2px solid transparent;color:var(--mu);padding:0 9px}.ph .tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.pb{flex:1;min-height:0;overflow:auto}
.mon{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#050506;position:relative;overflow:hidden}
.mon canvas,.mon video{max-width:100%;max-height:100%;background:#000}
#cv{box-shadow:0 0 0 1px #222}#ov.ovl,.mon canvas#ov{background:transparent}
.mon .guides{position:absolute;pointer-events:none;border:1px dashed #fff5}
.tcrow{height:34px;flex:none;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--p2);padding:0 8px;border-top:1px solid var(--ln)}
.tc{font:600 15px var(--mono);color:#6fb7ff;min-width:98px}.tc.d{color:var(--mu);font-size:12px;min-width:80px;text-align:right}
.scrub{height:16px;flex:none;background:#101012;position:relative;cursor:pointer;border-top:1px solid #000}
.scrub i{position:absolute;top:0;bottom:0;width:2px;background:#6fb7ff}.scrub b{position:absolute;top:0;bottom:0;background:#7a6bff44}
#pProj .pb,#fxBody{padding:6px}
.empty{color:var(--mu);padding:16px;text-align:center}
.assets{display:flex;flex-direction:column;gap:1px}
.asset{display:flex;align-items:center;gap:8px;padding:3px 5px;border-radius:3px;cursor:grab}.asset:hover{background:var(--p3)}.asset.sel{background:var(--ac2)}
.asset .th{width:58px;height:34px;border-radius:2px;background:#000 center/cover;flex:none;position:relative;display:grid;place-items:center;color:#fff8;font-size:15px}
.asset .nm{flex:1;min-width:0}.asset .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asset .nm small{color:var(--mu);font-size:10.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset.miss{opacity:.85}.asset.miss .th{outline:2px solid var(--er)}
.fold{color:var(--mu);font-weight:600;padding:5px 3px 2px;cursor:pointer}.fold:hover{color:var(--tx)}
.banner{background:#3a2a10;border:1px solid #7a5518;color:#ffd9a0;border-radius:4px;padding:6px 8px;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fxg{border-bottom:1px solid #000a;padding:4px 0}.fxg>.gh{display:flex;align-items:center;gap:6px;padding:3px 2px;font-weight:600;cursor:pointer}.fxg>.gh:before{content:"▾";color:var(--mu)}.fxg.c>.gh:before{content:"▸"}.fxg.c>.gb{display:none}
.row{display:grid;grid-template-columns:86px 1fr 58px 54px;gap:5px;align-items:center;padding:2px 2px 2px 14px}
.row label{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row input[type=number]{width:58px}
.kf{background:transparent;border:0;color:var(--mu);padding:0;font-size:12px}.kf.on{color:#ffd24d}
.row.anim label{color:#ffd24d}
.clip.bad{background-image:repeating-linear-gradient(45deg,#8a2323 0 8px,#5f1818 8px 16px)!important}
.selbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 6px;padding:5px 6px;background:#ffffff0d;border-radius:6px;font-size:12px}.selbar span{color:var(--mu);margin-right:auto}
button.dng{border-color:#a33;color:#ff8a8a}button.dng:hover{background:#a3333a}
#home{position:fixed;inset:0;z-index:90;background:#0b0e14;overflow:auto;display:flex;flex-direction:column}.htop{display:flex;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid #ffffff14;position:sticky;top:0;background:#0b0e14;z-index:1}.htop input{max-width:240px}.hbody{padding:18px 24px 40px}.hbody h3{margin:14px 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.hcard{background:#161a22;border:1px solid #ffffff14;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:3px;cursor:pointer}.hcard:hover{border-color:#ffb347}.hcard.cur{border-color:#ffb34788}.hcard small{color:var(--mu)}
.hth{height:84px;border-radius:7px;background:linear-gradient(135deg,#1f2733,#10141b);display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;margin-bottom:6px}.hth em{position:absolute;top:6px;right:8px;font-size:10px;font-style:normal;color:#111;background:#ffb347;padding:1px 7px;border-radius:9px}.hnm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hact{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.hact button{padding:3px 8px;font-size:12px}
.kfw{display:flex;gap:0;justify-content:flex-end}.kfw .kf{width:16px;text-align:center}
.kfs{position:relative;padding:4px 6px 6px}.kfpw{position:absolute;left:90px;right:12px;top:0;bottom:0;pointer-events:none}.kfph{position:absolute;top:0;bottom:0;width:1px;background:#ff5a5a;opacity:.9}
.kfln{display:flex;align-items:center;gap:6px;height:20px}.kfln>span{width:78px;color:var(--mu);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kft{position:relative;flex:1;height:14px;background:#0003;border-radius:3px}
.kfd{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;background:#ffd24d;transform:rotate(45deg);cursor:ew-resize;box-shadow:0 0 0 1px #000a}.kfd.m1{background:#ffd24d}.kfd.m0{background:#ffb347;border-radius:50%}.kfd.m2{background:#5cd0ff;border-radius:1px}
.clip .trb{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffffffb0,#ffffff20);border-right:1px dashed #fff;pointer-events:none;font-size:10px;color:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:2}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:3px 2px 3px 14px}
.eff{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:3px;cursor:grab}.eff:hover{background:var(--p3)}.eff i{font-style:normal;width:18px;text-align:center}
.cmt{padding:6px;border-radius:4px;background:var(--p2);margin-bottom:5px;border-left:3px solid var(--wa)}.cmt.done{opacity:.5}.cmt .who{font-weight:600}.cmt .t{font:11px var(--mono);color:#6fb7ff;cursor:pointer}
#tlTools{height:30px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--p2);border-bottom:1px solid var(--ln)}
#tlTools .sepv{width:1px;height:18px;background:#0008;margin:0 4px}
#tlWrap{flex:1;min-height:0;display:flex}
#tlScroll{flex:1;min-width:0;overflow:auto;position:relative;background:#151517}
#tlInner{position:relative;min-width:100%}
.trow{display:flex;border-bottom:1px solid #0009}
.th{position:sticky;left:0;z-index:5;width:128px;flex:none;background:var(--p2);border-right:1px solid #000;display:flex;align-items:center;gap:3px;padding:0 4px;font-weight:600}
.th .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:2px 3px;border-radius:3px}.th .tn.tg{background:var(--ac2)}
.th button{padding:1px 5px;font-size:10px;font-weight:700}.th button.on{background:#b5882a;border-color:#d8aa44}.th button.on.m{background:#b5382a}
.lane{position:relative;flex:none;background:repeating-linear-gradient(90deg,#0000 0,#0000 99px,#ffffff06 99px,#ffffff06 100px)}
.lane.v{height:56px}.lane.a{height:46px}.lane.lock{background-color:#ffffff08}.lane.drop{background-color:#7a6bff22}
#ruler{position:sticky;top:0;z-index:8;height:26px;display:flex;background:var(--p2);border-bottom:1px solid #000}
#ruler .th{height:26px;z-index:9;color:var(--mu);font-weight:400;font-size:10.5px;justify-content:center}
#rulerLane{position:relative;flex:none;cursor:col-resize;overflow:hidden}
.tick{position:absolute;bottom:0;width:1px;background:#fff4;height:6px}.tick.M{height:12px;background:#fff8}
.tl{position:absolute;top:2px;font:10px var(--mono);color:var(--mu);transform:translateX(3px);pointer-events:none}
.mk{position:absolute;top:0;width:10px;height:12px;margin-left:-3px;cursor:pointer;background:var(--wa);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);z-index:2}.mk.c{background:#5cd0ff}
.pk{position:absolute;top:0;bottom:0;width:2px;opacity:.9;pointer-events:none;z-index:1}.pk span{position:absolute;top:12px;left:3px;font:10px var(--ui);color:#000;padding:0 4px;border-radius:2px;white-space:nowrap}
#ph{position:absolute;top:0;bottom:0;width:0;z-index:7;pointer-events:none}
#ph:before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:#ff5d5d}
#phHead{position:sticky;top:0;z-index:10}
.clip{position:absolute;top:2px;bottom:2px;border-radius:3px;overflow:hidden;border:1px solid #0009;cursor:grab;background:var(--vid);background-size:auto 100%}
.clip.A{background:#27553f}.clip.T{background:var(--txt)}.clip.I{background:var(--img)}
.clip .lb{position:absolute;left:0;right:0;top:0;padding:1px 5px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#0007;text-shadow:0 1px 1px #000;pointer-events:none}
.clip.sel{outline:2px solid #fff;outline-offset:-2px;z-index:3}
.clip.miss{background-image:repeating-linear-gradient(45deg,#7a1f1f 0 8px,#5a1515 8px 16px)!important}
.clip .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}.clip .h.l{left:0}.clip .h.r{right:0}
.clip .fd{position:absolute;top:0;width:11px;height:11px;background:#fffc;border-radius:50%;cursor:ew-resize;z-index:3;display:none;transform:translateY(14px)}.clip:hover .fd,.clip.sel .fd{display:block}
.clip .fdl{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#000c,#0000);pointer-events:none}
.clip .gnl{position:absolute;left:0;right:0;height:1px;background:#ffe27a;pointer-events:none}
body.razor .clip{cursor:crosshair}
#meters{width:54px;flex:none;background:var(--p2);border-left:1px solid #000;display:flex;gap:4px;padding:6px 10px;justify-content:center}
#meters canvas{width:100%;height:100%}
.modal{position:fixed;inset:0;background:#000a;z-index:100;display:grid;place-items:center}
.md{background:var(--p2);border:1px solid #000;border-radius:8px;min-width:380px;max-width:min(860px,94vw);max-height:90vh;overflow:auto;padding:16px;box-shadow:0 12px 40px #000c}
.md h2{margin:0 0 10px;font-size:16px}.md .f{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin:6px 0}.md .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.md p{color:var(--mu);margin:6px 0}.md a{color:#8fb6ff}
.plist{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}.plist .it{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:4px;background:var(--p3);cursor:pointer}.plist .it:hover{background:var(--ac2)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--p3);border:1px solid var(--ac);padding:8px 14px;border-radius:6px;z-index:200;display:none;max-width:70vw}
.prog{height:8px;background:#000;border-radius:4px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--ac);width:0}
.mixr{display:flex;gap:6px;padding:8px;height:100%}
.mx{flex:1;min-width:48px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--p2);border-radius:4px;padding:6px 4px}
.mx input[type=range]{writing-mode:vertical-lr;direction:rtl;height:150px;width:22px}
.mx b{font-size:11px}.mx small{color:var(--mu);font:10px var(--mono)}
body.pointer-drag *{cursor:grabbing!important}
@media (max-width:1100px){#main{grid-template-columns:260px 1fr 1fr}}
</style></head><body>
<div id="app">
 <header id="top">
  <div class="brand"><i>E</i>EdiTsar</div>
  <div class="menu" id="mFile"><button>Archivo</button><div class="dd" id="ddFile"></div></div>
  <div class="menu" id="mEdit"><button>Edición</button><div class="dd" id="ddEdit"></div></div>
  <div class="menu" id="mSeq"><button>Secuencia</button><div class="dd" id="ddSeq"></div></div>
  <div class="ws" id="wsTabs"><button data-w="edit" class="on">Edición</button><button data-w="color">Color</button><button data-w="audio">Audio</button></div>
  <div class="sp"></div>
  <input id="pname" type="text" value="Sin título" spellcheck="false">
  <div class="sp"></div>
  <span id="sync"></span><div id="peers"></div>
  <button id="bCollab" class="pri">👥 Colaborar</button>
  <button id="bAcct">Cuenta</button>
  <a id="bHub" class="hubA" style="display:none"><button>‹ Hub</button></a>
 </header>
 <main id="main" class="ws-edit">
  <section class="panel" id="pFx"><div class="ph">Controles de efectos <span class="sp"></span><span id="fxSel" style="font-weight:400"></span></div><div class="pb" id="fxBody"></div></section>
  <section class="panel" id="pSrc">
   <div class="ph"><div class="tabs"><button class="on" data-t="src">Monitor de origen</button><button data-t="mix">Mezclador de audio</button></div><span class="sp"></span><span id="srcName" style="font-weight:400;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></span></div>
   <div id="srcView" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="mon" id="srcMon"><video id="srcVid" playsinline muted style="display:none" draggable="true"></video><canvas id="srcAud" width="640" height="120" style="display:none"></canvas><div id="srcEmpty" class="empty">Doble clic en un medio del panel Proyecto para verlo aquí</div></div>
    <div class="scrub" id="srcScrub"><b id="srcRange"></b><i id="srcHead"></i></div>
    <div class="tcrow"><span class="tc" id="srcTc">00:00:00:00</span>
     <button class="ic" id="sIn" title="Marcar entrada (I)">{</button><button class="ic" id="sPrev" title="Fotograma atrás">◂</button><button class="ic" id="sPlay" title="Reproducir">▶</button><button class="ic" id="sNext" title="Fotograma adelante">▸</button><button class="ic" id="sOut" title="Marcar salida (O)">}</button>
     <button id="sIns" title="Insertar (,)">Insertar</button><button id="sOvr" title="Sobrescribir (.)">Sobrescribir</button><span class="tc d" id="srcDur"></span></div>
   </div>
   <div id="mixView" style="display:none;flex:1;min-height:0;overflow:auto"></div>
  </section>
  <section class="panel" id="pProg">
   <div class="ph">Monitor de programa <span class="sp"></span><label style="font-weight:400">Calidad <select id="qual"><option value="1">Completa</option><option value=".5" selected>1/2</option><option value=".25">1/4</option></select></label><label style="font-weight:400"><input type="checkbox" id="chkGuides"> Guías</label></div>
   <div class="mon" id="progMon"><canvas id="cv" width="960" height="540"></canvas><canvas id="ov" style="position:absolute;pointer-events:none"></canvas><div class="guides" id="guides" style="display:none"></div></div>
   <div class="scrub" id="progScrub"><b id="progRange"></b><i id="progHead"></i></div>
   <div class="tcrow"><span class="tc" id="progTc">00:00:00:00</span><button class="ic" id="pStart" title="Ir al inicio (Inicio)">⏮</button><button class="ic" id="pPrevE" title="Edición anterior (↑)">⏪</button><button class="ic" id="pPrev" title="Fotograma atrás (←)">◂</button><button class="ic pri" id="pPlay" title="Reproducir / pausa (Espacio)">▶</button><button class="ic" id="pNext" title="Fotograma adelante (→)">▸</button><button class="ic" id="pNextE" title="Edición siguiente (↓)">⏩</button><button class="ic" id="pEnd" title="Ir al final (Fin)">⏭</button><button class="ic" id="pLoop" title="Repetir">⟳</button><button class="ic" id="pSnap" title="Exportar fotograma">📷</button><span class="tc d" id="progDur">00:00:00:00</span></div>
  </section>
  <section class="panel" id="pProj">
   <div class="ph"><div class="tabs" id="projTabs"><button class="on" data-t="proj">Proyecto</button><button data-t="eff">Efectos</button><button data-t="cmt">Comentarios</button></div></div>
   <div class="pb" id="projBody"></div>
  </section>
  <section class="panel" id="pTl">
   <div id="tlTools">
    <button class="ic on" id="tV" title="Selección (V)">➤</button><button class="ic" id="tC" title="Cuchilla (C)">✂</button><button class="ic" id="tT" title="Título (T)">T</button>
